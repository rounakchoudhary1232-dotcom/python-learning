[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS API foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "pydantic-settings>=2.4,<3.0", "uvicorn[standard]>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
